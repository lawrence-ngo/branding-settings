<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnyRoad Branding — Index</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #3D57FF;
  --blue-hover: #2d46e0;
  --blue-light: #eef0fd;
  --blue-mid: #c7d2fe;
  --text: #1a1f36;
  --sub: #697386;
  --muted: #9aa5b4;
  --border: #e3e8ee;
  --bg: #f7f8fc;
  --white: #ffffff;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 56px 24px;
}

.page {
  width: 100%;
  max-width: 760px;
}

/* ── Header ── */
.header {
  margin-bottom: 40px;
}
.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 10px;
}
.title {
  font-size: 32px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 12px;
  letter-spacing: -0.01em;
}
.subtitle {
  font-size: 15.5px;
  color: var(--sub);
  line-height: 1.6;
  max-width: 600px;
}

/* ── Section divider ── */
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 32px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

/* ── Cards ── */
.card-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card {
  display: flex;
  align-items: flex-start;
  gap: 18px;
  padding: 22px 24px;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.card:hover {
  border-color: var(--blue-mid);
  box-shadow: 0 6px 20px rgba(61, 87, 255, 0.08);
  transform: translateY(-1px);
}
.card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: var(--blue-light);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.card-icon svg { color: var(--blue); }
.card-body { flex: 1; min-width: 0; }
.card-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 5px;
  line-height: 1.3;
}
.card-desc {
  font-size: 13.5px;
  color: var(--sub);
  line-height: 1.55;
}
.card-chevron {
  flex-shrink: 0;
  color: var(--muted);
  margin-top: 14px;
  transition: color 0.15s, transform 0.15s;
}
.card:hover .card-chevron {
  color: var(--blue);
  transform: translateX(2px);
}

/* ── Footer ── */
.footer {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

@media (max-width: 600px) {
  body { padding: 32px 16px; }
  .title { font-size: 26px; }
  .subtitle { font-size: 14.5px; }
  .card { padding: 18px; gap: 14px; }
  .card-icon { width: 40px; height: 40px; }
  .card-title { font-size: 15px; }
}
</style>
</head>
<body>

<div class="page">

  <header class="header">
    <div class="eyebrow">AnyRoad</div>
    <h1 class="title">Branding Settings</h1>
    <p class="subtitle">Pick wherever you'd like to start.</p>
  </header>

  <div class="card-grid">

    <a class="card" href="app-prototype.html">
      <div class="card-icon">
        <svg width="22" height="22" fill="none" viewBox="0 0 22 22"><rect x="2.5" y="3.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 7.5h17" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="5.5" r="0.6" fill="currentColor"/><circle cx="7" cy="5.5" r="0.6" fill="currentColor"/><circle cx="9" cy="5.5" r="0.6" fill="currentColor"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">Prototype</div>
        <div class="card-desc">Jump in and click around.</div>
      </div>
      <svg class="card-chevron" width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a class="card" href="app-tutorial.html">
      <div class="card-icon">
        <svg width="22" height="22" fill="none" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 7.5l5.5 3.5L8 14.5z" fill="currentColor"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">Guided tour</div>
        <div class="card-desc">Same prototype, with a walkthrough.</div>
      </div>
      <svg class="card-chevron" width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

    <a class="card" href="system-guide.html">
      <div class="card-icon">
        <svg width="22" height="22" fill="none" viewBox="0 0 22 22"><path d="M5 2.5h9l4 4v13a0 0 0 0 1 0 0H5a0 0 0 0 1 0 0V2.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 2.5v4h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 11h7M8 14h7M8 17h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">System guide</div>
        <div class="card-desc">How it works, and why.</div>
      </div>
      <svg class="card-chevron" width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>

  </div>

  <div class="footer">
    <span>AnyRoad · Branding Settings</span>
    <span>Internal design preview</span>
  </div>

</div>

</body>
</html>
